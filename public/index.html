<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Search Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
:root {
    --primary-color: #007bff;
    --secondary-color: #0056b3;
    --background-color: #f4f4f4;
    --card-background: #fff;
    --text-color: #333;
    --text-secondary-color: #666;
    --border-color: #ccc;
    --border-radius: 5px;
    --box-shadow-light: rgba(0, 0, 0, 0.1);
    --box-shadow-hover: rgba(0, 0, 0, 0.2);
    --spinner-color: #007bff;
    --spinner-size: 50px;
    --font-family: 'Poppins', sans-serif;
    --font-size-base: 0.9rem;
    --font-size-small: 0.85rem;
    --header-font-size: 1.8rem;
    --header-font-size-mobile: 1.5rem;
    --max-card-height: 400px;
}

body {
    font-family: var(--font-family);
    background-color: var(--background-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
}

header {
    background-color: var(--text-color);
    color: #fff;
    padding: 20px 0;
    text-align: center;
    box-shadow: 0 2px 5px var(--box-shadow-light);
}

header h1 {
    font-size: var(--header-font-size);
    margin: 0;
}

.search-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background-color: #fff;
    box-shadow: 0 2px 5px var(--box-shadow-light);
    flex-wrap: wrap;
    gap: 10px;
}

.search-wrapper {
    position: relative;
    flex: 2;
    min-width: 200px;
}

.search-container input,
.search-container select {
    padding: 10px;
    font-size: var(--font-size-base);
    border-radius: var(--border-radius);
    border: 1px solid var(--border-color);
    width: 100%;
}

.search-container select {
    flex: 1;
    min-width: 130px;
}

.search-container button {
    background-color: var(--primary-color);
    padding: 10px 15px;
    color: white;
    font-size: var(--font-size-base);
    border: none;
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
    white-space: nowrap;
}

.search-container button:hover {
    background-color: var(--secondary-color);
    transform: scale(1.05);
}

/* Suggestions dropdown */
#suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border-color);
    border-top: none;
    border-radius: 0 0 var(--border-radius) var(--border-radius);
    box-shadow: 0 4px 8px var(--box-shadow-light);
    z-index: 100;
    max-height: 220px;
    overflow-y: auto;
}

#suggestions li {
    padding: 9px 12px;
    cursor: pointer;
    font-size: var(--font-size-small);
    list-style: none;
    border-bottom: 1px solid #f0f0f0;
}

#suggestions li:last-child { border-bottom: none; }
#suggestions li:hover, #suggestions li.active { background-color: #e8f0fe; color: var(--primary-color); }

/* Sort bar */
.sort-bar {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: #fff;
    border-top: 1px solid #eee;
    flex-wrap: wrap;
}

.sort-bar.visible { display: flex; }

.sort-bar span {
    font-size: var(--font-size-small);
    color: var(--text-secondary-color);
    font-weight: 500;
}

.sort-btn {
    background: none;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: var(--font-size-small);
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-color);
}

.sort-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
.sort-btn.active { background-color: var(--primary-color); color: #fff; border-color: var(--primary-color); }
.sort-btn .arrow { font-size: 0.7rem; margin-left: 3px; }

.results-info {
    text-align: center;
    padding: 10px;
    font-size: var(--font-size-small);
    color: var(--text-secondary-color);
    display: none;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 20px 40px;
}

.movie-card {
    background-color: var(--card-background);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px var(--box-shadow-light);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s, box-shadow 0.3s;
    height: 100%;
    max-height: var(--max-card-height);
    position: relative;
}

.movie-card:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 16px var(--box-shadow-hover);
}

.movie-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    transition: opacity 0.3s;
}

.movie-card img:hover { opacity: 0.8; }

.movie-details {
    padding: 10px;
    text-align: left;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
}

.movie-details h5 {
    font-size: 1rem;
    margin: 0;
    color: var(--primary-color);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.movie-details p {
    font-size: var(--font-size-small);
    color: var(--text-secondary-color);
    margin: 5px 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.button-container {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: auto;
    padding: 10px;
}

.btn-custom {
    background-color: var(--primary-color);
    color: white;
    padding: 8px;
    text-decoration: none;
    border-radius: var(--border-radius);
    display: block;
    transition: background-color 0.3s, transform 0.2s;
    font-size: var(--font-size-small);
    text-align: center;
}

.btn-custom:hover {
    background-color: var(--secondary-color);
    transform: scale(1.05);
}

.spinner-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.8);
    z-index: 1000;
}

.spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid var(--spinner-color);
    border-radius: 50%;
    width: var(--spinner-size);
    height: var(--spinner-size);
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@media (max-width: 768px) {
    header h1 { font-size: var(--header-font-size-mobile); }

    .search-container { flex-direction: column; padding: 15px; }

    .search-wrapper,
    .search-container select,
    .search-container button { width: 100%; }
}
    </style>
</head>

<body>

    <header>
        <h1>Ultimate Torrent Finder</h1>
    </header>

    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="query" class="form-control" placeholder="Enter torrent name..." autocomplete="off">
            <ul id="suggestions"></ul>
        </div>
        <select id="website" class="form-select"></select>
        <input type="number" id="page" class="form-control" placeholder="Page" min="1" style="flex:0;width:80px;">
        <button onclick="searchTorrents()">Search</button>
    </div>

    <div class="sort-bar" id="sort-bar">
        <span>Sort by:</span>
        <button class="sort-btn active" data-sort="seeders">Seeders <span class="arrow">▼</span></button>
        <button class="sort-btn" data-sort="leechers">Leechers <span class="arrow">▼</span></button>
        <button class="sort-btn" data-sort="size">Size <span class="arrow">▼</span></button>
        <button class="sort-btn" data-sort="name">Name <span class="arrow">▼</span></button>
    </div>

    <div class="results-info" id="results-info"></div>

    <div id="results" class="movie-grid"></div>

    <div id="spinner-container" class="spinner-container" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    let allResults = [];
    let currentSort = { key: 'seeders', dir: 'desc' };
    let suggestTimer = null;
    let suggestionIndex = -1;

    // Load providers
    $(async function () {
        const $select = $('#website');
        try {
            const resp = await fetch('/api/torrents');
            const providers = await resp.json();
            $select.empty();
            providers.forEach(p => $select.append(`<option value="${p}">${p}</option>`));
        } catch {
            $select.empty().append('<option value="">No providers available</option>');
        }
    });

    // Search suggestions (debounced, via PirateBay suggest API)
    $('#query').on('input', function () {
        const q = $(this).val().trim();
        clearTimeout(suggestTimer);
        suggestionIndex = -1;
        if (q.length < 2) { hideSuggestions(); return; }
        suggestTimer = setTimeout(() => fetchSuggestions(q), 280);
    });

    async function fetchSuggestions(q) {
        try {
            const resp = await fetch(`https://apibay.org/q.php?q=${encodeURIComponent(q)}&cat=0`);
            const data = await resp.json();
            // apibay returns torrent objects; extract unique name prefixes as suggestions
            const seen = new Set();
            const suggestions = [];
            for (const item of data) {
                if (!item.name || item.name === 'No results returned') continue;
                // shorten to first few words for cleaner suggestions
                const words = item.name.split(' ').slice(0, 5).join(' ');
                if (!seen.has(words.toLowerCase())) {
                    seen.add(words.toLowerCase());
                    suggestions.push(words);
                }
                if (suggestions.length >= 8) break;
            }
            renderSuggestions(suggestions);
        } catch {
            hideSuggestions();
        }
    }

    function renderSuggestions(items) {
        const $list = $('#suggestions').empty();
        if (!items.length) { hideSuggestions(); return; }
        items.forEach(text => {
            $('<li>').text(text).on('mousedown', function () {
                $('#query').val($(this).text());
                hideSuggestions();
                searchTorrents();
            }).appendTo($list);
        });
        $list.show();
    }

    function hideSuggestions() {
        $('#suggestions').hide().empty();
        suggestionIndex = -1;
    }

    // Keyboard navigation for suggestions
    $('#query').on('keydown', function (e) {
        const $items = $('#suggestions li');
        if (!$items.length) {
            if (e.key === 'Enter') searchTorrents();
            return;
        }
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            suggestionIndex = Math.min(suggestionIndex + 1, $items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            suggestionIndex = Math.max(suggestionIndex - 1, -1);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (suggestionIndex >= 0) {
                $('#query').val($items.eq(suggestionIndex).text());
                hideSuggestions();
                searchTorrents();
            } else {
                hideSuggestions();
                searchTorrents();
            }
            return;
        } else if (e.key === 'Escape') {
            hideSuggestions(); return;
        } else { return; }
        $items.removeClass('active').eq(suggestionIndex).addClass('active');
        if (suggestionIndex >= 0) $('#query').val($items.eq(suggestionIndex).text());
    });

    // Hide suggestions when clicking outside
    $(document).on('mousedown', function (e) {
        if (!$(e.target).closest('.search-wrapper').length) hideSuggestions();
    });

    // Search
    async function searchTorrents() {
        const query = $('#query').val().trim();
        const website = $('#website').val();
        const page = $('#page').val();
        if (!website || !query) return;

        hideSuggestions();
        $('#spinner-container').show();
        $('#results').empty();
        $('#sort-bar').removeClass('visible');
        $('#results-info').hide();

        let apiUrl = `/api/${encodeURIComponent(website)}/${encodeURIComponent(query)}`;
        if (page) apiUrl += `/${page}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (!data || data.length === 0) {
                $('#results').html('<div class="text-center col-12">No results found.</div>');
                return;
            }

            allResults = data;
            renderResults();
            $('#sort-bar').addClass('visible');
        } catch {
            $('#results').html('<div class="text-center text-danger col-12">Failed to load results.</div>');
        } finally {
            $('#spinner-container').hide();
        }
    }

    // Sorting
    $('#sort-bar').on('click', '.sort-btn', function () {
        const key = $(this).data('sort');
        if (currentSort.key === key) {
            currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
        } else {
            currentSort = { key, dir: key === 'name' ? 'asc' : 'desc' };
        }
        $('#sort-bar .sort-btn').removeClass('active').find('.arrow').text('▼');
        $(this).addClass('active').find('.arrow').text(currentSort.dir === 'desc' ? '▼' : '▲');
        renderResults();
    });

    function parseSize(str) {
        if (!str) return 0;
        const s = str.replace(/,/g, '').replace(/&nbsp;/g, ' ').trim();
        const m = s.match(/([\d.]+)\s*(TB|GB|MB|KB|B)/i);
        if (!m) return 0;
        const n = parseFloat(m[1]);
        const u = m[2].toUpperCase();
        return n * ({ TB: 1e12, GB: 1e9, MB: 1e6, KB: 1e3, B: 1 }[u] || 1);
    }

    function renderResults() {
        const sorted = [...allResults].sort((a, b) => {
            let va, vb;
            if (currentSort.key === 'seeders') {
                va = parseInt(a.Seeders) || 0; vb = parseInt(b.Seeders) || 0;
            } else if (currentSort.key === 'leechers') {
                va = parseInt(a.Leechers) || 0; vb = parseInt(b.Leechers) || 0;
            } else if (currentSort.key === 'size') {
                va = parseSize(a.Size); vb = parseSize(b.Size);
            } else {
                va = (a.Name || '').toLowerCase(); vb = (b.Name || '').toLowerCase();
                return currentSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
            }
            return currentSort.dir === 'desc' ? vb - va : va - vb;
        });

        const $results = $('#results').empty();
        const $info = $('#results-info');
        $info.text(`${sorted.length} result${sorted.length !== 1 ? 's' : ''}`).show();

        sorted.forEach(torrent => {
            const magnet = torrent.Magnet || torrent.MagnetLink || '';
            const poster = torrent.Poster ? `<img src="${torrent.Poster}" alt="${torrent.Name}">` : '';
            $results.append(
                `<div class="movie-card">
                    ${poster}
                    <div class="movie-details">
                        <h5 title="${torrent.Name || ''}">${torrent.Name || 'N/A'}</h5>
                        <p><strong>Size:</strong> ${torrent.Size || 'N/A'}</p>
                        <p><strong>Seeds:</strong> ${torrent.Seeders || 'N/A'} &nbsp;|&nbsp; <strong>Leech:</strong> ${torrent.Leechers || 'N/A'}</p>
                        <div class="button-container">
                            ${magnet ? `<a href="${magnet}" class="btn-custom">Magnet</a>` : ''}
                            ${torrent.Url ? `<a href="${torrent.Url}" class="btn-custom" target="_blank">View</a>` : ''}
                        </div>
                    </div>
                </div>`
            );
        });
    }
    </script>

</body>

</html>
